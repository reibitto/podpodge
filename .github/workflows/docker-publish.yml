name: Publish Docker image

# Publishes to GitHub Container Registry (ghcr.io) rather than Docker Hub: auth needs no secrets (the automatic
# GITHUB_TOKEN is enough), and GHCR doesn't impose the anonymous pull rate limits that Docker Hub does, which
# self-hosted users running `docker pull` behind a shared IP tend to run into.
#
# NOTE: the first successful run creates the package as *private*, even though the repo is public. It has to be
# flipped to public once, by hand, under the repo's Packages settings, or `docker pull` will 401 for everyone else.

on:
  push:
    # Release on version tags only. Building for two architectures takes a while (the non-native one runs under
    # emulation), so it's deliberately not wired to every push to master.
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # Tests run here too so a broken build can't be published under a version tag. `Docker/stage` writes the
      # Dockerfile and its context to target/docker/stage (pinned in build.sbt) instead of building the image --
      # sbt-native-packager's own `Docker/publishLocal` can only produce a single-architecture image.
      - name: Run tests and stage the Docker build context
        run: sbt -Dscalac.lenientDev.enabled=false "test; podpodge/Docker/stage"

      # Emulation for whichever architecture the runner isn't.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest=auto` moves :latest onto each new semver tag. Manual runs publish :edge instead, so they can be
          # used to smoke-test image changes without pretending to be a release.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: target/docker/stage
          # amd64 covers most self-hosting (NAS boxes, x86 servers, VPSes); arm64 covers Raspberry Pi, Apple Silicon
          # and ARM VPSes. Publishing only the architecture the runner happens to use would leave out half of them.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
