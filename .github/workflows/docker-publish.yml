name: Publish Docker image

# Publishes to ghcr.io, which needs only GITHUB_TOKEN and has no anonymous pull rate limits.
#
# NOTE: The first run creates the package as private. Make it public once in the repo's Packages settings, or
# `docker pull` will return 401 for everyone else.

on:
  push:
    # Tags only, since the multi-arch build (emulated) is slow.
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # `Docker/stage` writes the build context to target/docker/stage (see build.sbt). buildx builds it, since
      # `Docker/publishLocal` only produces a single-architecture image.
      - name: Run tests and stage the Docker build context
        run: sbt -Dscalac.lenientDev.enabled=false "test; podpodge/Docker/stage"

      # Emulates the non-native architecture.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Semver tags also move :latest. Manual runs publish :edge for testing.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: target/docker/stage
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
